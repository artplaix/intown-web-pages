<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>intown-app.ru — Технические работы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: #f8fafc;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Декоративные элементы на фоне */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
        }

        body::before {
            width: 600px;
            height: 600px;
            background: #3b82f6;
            top: -200px;
            right: -100px;
        }

        body::after {
            width: 500px;
            height: 500px;
            background: #8b5cf6;
            bottom: -150px;
            left: -150px;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 640px;
            width: 100%;
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 64px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 48px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 22px;
            color: #fff;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #f8fafc;
        }

        .logo-text span {
            color: #60a5fa;
        }

        .icon-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
        }

        .icon {
            width: 72px;
            height: 72px;
            background: rgba(59, 130, 246, 0.15);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon svg {
            width: 36px;
            height: 36px;
            stroke: #60a5fa;
            stroke-width: 1.5;
            fill: none;
        }

        h1 {
            font-size: clamp(28px, 5vw, 36px);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: clamp(15px, 2vw, 17px);
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 40px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 100px;
            padding: 8px 20px;
            margin-bottom: 40px;
            font-size: 14px;
            font-weight: 600;
            color: #fbbf24;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #fbbf24;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .progress-bar {
            width: 100%;
            max-width: 320px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            margin: 0 auto 40px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 60%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 100px;
            animation: loading 3s ease-in-out infinite;
        }

        @keyframes loading {
            0% { width: 20%; }
            50% { width: 80%; }
            100% { width: 20%; }
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin-bottom: 32px;
        }

        .note {
            font-size: 14px;
            line-height: 1.6;
            color: #64748b;
        }

        .note a {
            color: #60a5fa;
            text-decoration: none;
            border-bottom: 1px solid rgba(96, 165, 250, 0.3);
            transition: border-color 0.2s;
        }

        .note a:hover {
            border-color: #60a5fa;
        }

        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #475569;
        }

        @media (max-width: 480px) {
            .container {
                padding: 48px 24px;
                border-radius: 24px;
            }
            .logo {
                margin-bottom: 36px;
            }
            .status-badge {
                margin-bottom: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">i</div>
            <div class="logo-text">in<span>town</span></div>
        </div>

        <div class="icon-wrapper">
            <div class="icon">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 6v6l4 2" />
                    <circle cx="12" cy="12" r="10" />
                </svg>
            </div>
        </div>

        <h1>Технические работы</h1>
        <p class="subtitle">
            Мы обновляем инфраструктуру, чтобы сделать intown ещё быстрее и надёжнее. 
            Приложение и сайт временно недоступны.
        </p>

        <div class="status-badge">
            <span class="status-dot"></span>
            Восстановление в процессе
        </div>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <div class="divider"></div>

        <p class="note">
            Следите за обновлениями в нашем 
            <a href="https://t.me/intown_app" target="_blank" rel="noopener">Telegram-канале</a>. 
            Приносим извинения за неудобства.
        </p>

        <div class="footer">
            © 2026 intown-app.ru
        </div>
    </div>
</body>
</html>
